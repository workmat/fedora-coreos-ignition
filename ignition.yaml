
variant: fcos
version: 1.6.0

# User accounts and authentication
passwd:
  users:
    - name: core
      groups:
        - wheel
      ssh_authorized_keys:
        - "REPLACE_WITH_YOUR_SSH_PUBLIC_KEY"

# Operating system configuration
storage:
  files:

    # Hostname
    - path: /etc/hostname
      mode: 0644
      overwrite: true
      contents:
        inline: |
          fedora-fcos-vm

    # Static network configuration
    - path: /etc/NetworkManager/system-connections/static.nmconnection
      mode: 0600
      contents:
        inline: |
          [connection]
          id=static
          type=ethernet
          autoconnect=true
          autoconnect-priority=100

          [ethernet]
          mac-address=52:54:00:12:34:56

          [ipv4]
          method=manual
          address1=192.168.1.100/24
          gateway=192.168.1.1
          dns=192.168.1.1;
          may-fail=false

          [ipv6]
          method=auto
